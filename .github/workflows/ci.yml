name: GenBridge CI & Health Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run Build Script
      run: npm run build

    - name: Start Server & Test Health Endpoint
      run: |
        node server.js &
        sleep 2
        curl -f http://127.0.0.1:3000/api/health || exit 1
        curl -f http://127.0.0.1:3000/api/settings || exit 1
        echo "GenBridge API and Database operational!"
